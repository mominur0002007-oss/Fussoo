plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tuvr.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tuvr.app'
        // Android 7.0 and newer. Tested target: TECNO Spark 10C / Android 12 (API 31).
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
        resourceConfigurations += ['en']
    }

    signingConfigs {
        release {
            // A dedicated personal release key is committed so that every CI build of
            // the APK can be installed over the previous one (same signature).
            // See docs/BUILD.md before publishing anything publicly.
            storeFile file('../keystore/tuvr-release.jks')
            storePassword 'tuvr-release-2026'
            keyAlias 'tuvr'
            keyPassword 'tuvr-release-2026'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // ---------- AndroidX (kept deliberately small) ----------
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'

    // ---------- Media: hardware accelerated decode (ExoPlayer / Media3) ----------
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
}
