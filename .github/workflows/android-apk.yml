name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon --project-dir android :app:assembleDebug
      - name: Give APK a product name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/TU-VR-Player-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TU-VR-Player-debug-APK
          path: android/app/build/outputs/apk/debug/TU-VR-Player-debug.apk
          if-no-files-found: error
          retention-days: 14
