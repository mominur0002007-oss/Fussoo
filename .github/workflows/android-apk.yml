name: Android APK

on:
  workflow_dispatch:
    inputs:
      stage_apk_for_drive:
        description: Temporarily stage the APK on this branch for Drive upload, then remove it
        type: boolean
        required: false
        default: false
  push:
    paths:
      - 'android/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon --project-dir android :app:assembleDebug
      - name: Give APK a product name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/TU-VR-Player-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TU-VR-Player-debug-APK
          path: android/app/build/outputs/apk/debug/TU-VR-Player-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Temporarily stage APK on the current branch for Drive upload
        if: ${{ contains(github.event.head_commit.message, '[stage-apk-for-drive]') }}
        run: |
          mkdir -p .drive-handoff
          cp android/app/build/outputs/apk/debug/TU-VR-Player-debug.apk .drive-handoff/TU-VR-Player-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .drive-handoff/TU-VR-Player-debug.apk
          git commit -m "ci: temporary APK handoff for Drive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
