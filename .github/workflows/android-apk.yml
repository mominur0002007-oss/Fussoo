name: TU VR APK

# Builds the TU VR APK entirely in the cloud so that a phone-only
# developer workflow is possible: push (or press "Run workflow") and
# download the APK artifact from the run page.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android platform + build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug + release APK
        run: |
          set -o pipefail
          gradle --no-daemon --project-dir android --console=plain \
            :app:assembleDebug :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Stage APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/TUVR-1.0.0-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/TUVR-1.0.0-release.apk
          cd dist && sha256sum *.apk | tee SHA256SUMS.txt
          ls -lh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TUVR-APK
          path: dist/**
          if-no-files-found: error
          retention-days: 30

      # Lint findings are committed back so they can be reviewed without log access.
      - name: Static analysis (lint)
        run: |
          set +e
          gradle --no-daemon --project-dir android --console=plain :app:lintDebug \
            > "$RUNNER_TEMP/lint.log" 2>&1
          mkdir -p ci
          {
            echo "TU VR static analysis"
            echo "run: $GITHUB_RUN_ID"
            echo
            grep -E "^(/|[A-Za-z]:).*(Error|Warning):" "$RUNNER_TEMP/lint.log" | head -150
            echo
            grep -E "errors?, [0-9]+ warnings?" "$RUNNER_TEMP/lint.log" | tail -3
          } > ci/lint.txt
          git config user.name "ci-diagnostics"
          git config user.email "ci@tuvr.invalid"
          git add ci/lint.txt
          git commit -m "ci: lint report for $GITHUB_RUN_ID [skip ci]" || true
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      # On failure the compile errors are committed back to the branch so that
      # they can be read without access to the Actions log.
      - name: Publish build diagnostics
        if: failure()
        run: |
          mkdir -p ci
          {
            echo "TU VR build diagnostics"
            echo "run: $GITHUB_RUN_ID  commit: $GITHUB_SHA"
            echo
            grep -E "^e: |error:|Error:|FAILED|What went wrong|Execution failed|> Task .* FAILED" \
              "$RUNNER_TEMP/build.log" 2>/dev/null | head -400
            echo
            grep -A 25 -E "^\* What went wrong|^Caused by:|Could not|Failed to apply" \
              "$RUNNER_TEMP/build.log" 2>/dev/null | head -200
            echo
            echo "---- tail ----"
            tail -400 "$RUNNER_TEMP/build.log" 2>/dev/null
          } > ci/last-build.log
          git config user.name "ci-diagnostics"
          git config user.email "ci@tuvr.invalid"
          git add ci/last-build.log
          git commit -m "ci: build diagnostics for $GITHUB_RUN_ID [skip ci]" || true
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
