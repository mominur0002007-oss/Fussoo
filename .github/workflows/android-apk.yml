name: TU VR APK

# Builds the TU VR APK entirely in the cloud so that a phone-only
# developer workflow is possible: push (or press "Run workflow") and
# download the APK artifact from the run page.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android platform + build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug + release APK
        run: |
          gradle --no-daemon --project-dir android :app:assembleDebug :app:assembleRelease

      - name: Stage APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/TUVR-1.0.0-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/TUVR-1.0.0-release.apk
          cd dist && sha256sum *.apk | tee SHA256SUMS.txt
          ls -lh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TUVR-APK
          path: dist/**
          if-no-files-found: error
          retention-days: 30
